<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./Css/base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body data-page="login">
    <div class="login-bg d-grid place-items-center">
    <div class="container d-flex flex-column justify-content-center min-vh-100 py-4">
        <!-- Enlace para regresar a la página principal -->
        <div class="d-flex justify-content-between mb-4">
            <a class="navlink" href="index.html">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
            <!-- Botón para cambiar entre tema claro y oscuro (Debe estar en todas las paginas)-->
            <button
                class="btn btn-line btn-sm theme-btn"
                data-theme-toggle
                aria-label="Cambiar tema">
                <i class="bi bi-moon-stars"></i>
                <i class="bi bi-sun"></i>
            </button>
        </div>

        <form
            id="lf"
            novalidate
            class="card-bk p-4 mx-auto w-100"
            style="max-width: 420px">
        <!-- Encabezado del formulario con icono, título y descripción -->
            <div class="text-center mb-3">
                <i class="bi bi-book-half text-gold fs-1"></i>
                <h1 class="h3 mt-2">Acceso de administrador</h1>
                <p class="text-muted-bk small">
                Ingresa con tu cuenta institucional.</p>
            </div>

            <div class="mb-3">
                <label class="form-label" for="e">
                    Correo electrónico
                </label>
                <!-- Campo para ingresar el correo electrónico -->
                <input
                    id="e"
                    class="form-control"
                    type="email"
                    placeholder="nombre@biblioteca.org">
            </div>

            <div class="mb-3">
                <label class="form-label" for="p">
                    Contraseña
                </label>
                <!-- Campo para ingresar la contraseña -->
                <input
                    id="p"
                    class="form-control"
                    type="password"
                    placeholder="••••••••">
            </div>
            <!-- Contenedor donde JavaScript muestra errores y advertencias -->
            <div
                id="err"
                class="alert alert-danger py-2 small d-none"
                role="alert">
            </div>

            <button class="btn btn-wine w-100" type="submit"  >
                Ingresar
            </button>

            <p class="text-center small text-muted-bk mt-3 mb-0">
                ¿Aún no tienes cuenta? Pide acceso en recepción.
                <br> 
            </p> 
        </form>

    </div>
</div>
<!-- Script para gestionar la autenticación y las sesiones -->
<script src="./js/auth.js"></script>

<!-- Script para gestionar el cambio de tema -->
<script src="./js/tema.js"></script>

</body>
</html>
